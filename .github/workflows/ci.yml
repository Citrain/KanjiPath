name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-password
          MARIADB_DATABASE: kanjipath_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL_TEST: mysql://root:ci-password@127.0.0.1:3306/kanjipath_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kanjipath/api prisma:generate

      - run: pnpm --filter @kanjipath/api exec prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/kanjipath_test

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm content:build
